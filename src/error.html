<!doctype html>
<!--
	Static fallback used when the root layout itself fails (e.g. database down → 503), so the app
	shell cannot render. Self-contained: inline CSS only, no scripts, no external assets.
	SvelteKit HTML-escapes %sveltekit.error.message%; %sveltekit.status% is a number.
-->
<html lang="th">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="robots" content="noindex" />
		<title>%sveltekit.status% · ระบบขัดข้องชั่วคราว · Worldview</title>
		<style>
			:root {
				color-scheme: light dark;
				--bg: #f7f8f5;
				--surface: #ffffff;
				--text: #172622;
				--muted: #5c6b65;
				--stroke: #e3e9e3;
				--accent: #176653;
				--on-accent: #ffffff;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #101917;
					--surface: #192522;
					--text: #ebf2ee;
					--muted: #a6b5ae;
					--stroke: #304039;
					--accent: #91d9b8;
					--on-accent: #0c1713;
				}
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100svh;
				display: grid;
				place-items: center;
				padding: 24px 18px calc(24px + env(safe-area-inset-bottom));
				background: var(--bg);
				color: var(--text);
				font-family: 'Noto Sans Thai', Tahoma, 'Segoe UI', system-ui, sans-serif;
				font-size: 14px;
				line-height: 1.7;
			}
			main {
				width: 100%;
				max-width: 520px;
				background: var(--surface);
				border: 1px solid var(--stroke);
				border-radius: 20px;
				padding: 28px 24px;
			}
			.eyebrow {
				margin: 0 0 10px;
				font-size: 11px;
				font-weight: 700;
				letter-spacing: 0.14em;
				color: var(--accent);
			}
			h1 {
				margin: 0 0 8px;
				font-size: 26px;
				line-height: 1.35;
			}
			p {
				margin: 0 0 18px;
				color: var(--muted);
			}
			.actions {
				display: flex;
				flex-wrap: wrap;
				gap: 8px;
			}
			a {
				display: inline-flex;
				align-items: center;
				min-height: 44px;
				padding: 0 16px;
				border-radius: 11px;
				border: 1px solid var(--stroke);
				color: var(--text);
				font-weight: 700;
				text-decoration: none;
			}
			a.primary {
				background: var(--accent);
				border-color: var(--accent);
				color: var(--on-accent);
			}
			a:focus-visible {
				outline: 3px solid var(--accent);
				outline-offset: 3px;
			}
		</style>
	</head>
	<body>
		<main>
			<p class="eyebrow">WORLDVIEW · ERROR %sveltekit.status%</p>
			<h1>ระบบขัดข้องชั่วคราว</h1>
			<p>ขออภัย ระบบยังไม่พร้อมให้บริการในขณะนี้ กรุณาลองใหม่อีกครั้งในอีกสักครู่</p>
			<p>รายละเอียด: %sveltekit.error.message%</p>
			<div class="actions">
				<a class="primary" href="">ลองใหม่</a>
				<a href="/">กลับหน้าแรก</a>
			</div>
		</main>
	</body>
</html>
